version: '3'

tasks:
  clean:
    desc: "clean build"
    platforms: ["windows"]
    cmds:
      - cmd: cmd /c "rmdir /s /q build"
        platforms: ["windows"]
      - cmd: "rm -rf build"
        platforms: ["darwin", "linux"]



  configure:
    desc: "configure CMake"
    sources:
      - "**/CMakeLists.txt"
      - "vcpkg.json"
    generates:
      - "build/CMakeCache.txt"
    cmds:
      - "cmake --preset default"

  build:
    desc: "compile project"
    deps: ["configure"]
    cmds:
      - "cmake --build --preset default"



  install:
    desc: "install build"
    deps: ["build"]
    vars:
      PREFIX: '{{.PREFIX | default ""}}'
    cmds:
      - |
        {{if .PREFIX}}
        cmake --install build --prefix "{{.PREFIX}}"
        {{else}}
        cmake --install build
        {{end}}



  test-converter:
    desc: "test tests/converter.cpp"
    deps: ["build"]
    cmds:
      - cmd: "./build/tests/converter.exe"
        platforms: ["windows"]
      - cmd: "./build/tests/converter"
        platforms: ["darwin", "linux"]
  
  test-reader:
    desc: "test tests/reader.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/tests/reader.exe"
        platforms: ["windows"]
      - cmd: "./build/tests/reader"
        platforms: ["darwin", "linux"]

  test-nearest:
    desc: "test tests/nearest.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/tests/nearest.exe"
        platforms: ["windows"]
      - cmd: "./build/tests/nearest"
        platforms: ["darwin", "linux"]

  test-visited:
    desc: "test tests/visited.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/tests/visited.exe"
        platforms: ["windows"]
      - cmd: "./build/tests/visited"
        platforms: ["darwin", "linux"]

  test-heap:
    desc: "test tests/heap.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/tests/heap.exe"
        platforms: ["windows"]
      - cmd: "./build/tests/heap"
        platforms: ["darwin", "linux"]

  test-pathing:
    desc: "test tests/pathing.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/tests/pathing.exe"
        platforms: ["windows"]
      - cmd: "./build/tests/pathing"
        platforms: ["darwin", "linux"]



  e-bgplot:
    desc: "run experiments/bgplot.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/experiments/bgplot.exe"
        platforms: ["windows"]
      - cmd: "./build/experiments/bgplot"
        platforms: ["darwin", "linux"]

  e-pathplot:
    desc: "run experiments/pathplot.c"
    deps: ["build"]
    cmds:
      - cmd: "./build/experiments/pathplot.exe"
        platforms: ["windows"]
      - cmd: "./build/experiments/pathplot"
        platforms: ["darwin", "linux"]
