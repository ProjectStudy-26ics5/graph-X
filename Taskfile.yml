version: '3'

tasks:
  clean:
    desc: "clean build"
    platforms: ["windows"]
    cmds:
      - cmd /c "rmdir /s /q build"
  clean:
    desc: "clean build"
    platforms: ["darwin", "linux"]
    cmds:
      - "rm -rf build"



  configure:
    desc: "configure CMake"
    sources:
      - "**/CMakeLists.txt"
      - "vcpkg.json"
    generates:
      - "build/CMakeCache.txt"
    cmds:
      - "cmake --preset default"

  build:
    desc: "compile project"
    deps: ["configure"]
    cmds:
      - "cmake --build --preset default"



  install:
    desc: "install build"
    deps: ["build"]
    vars:
      PREFIX: '{{.PREFIX | default ""}}'
    cmds:
      - |
        {{if .PREFIX}}
        cmake --install build --prefix "{{.PREFIX}}"
        {{else}}
        cmake --install build
        {{end}}



  run-converter:
    desc: "run tests/converter.cpp"
    deps: ["build"]
    platforms: ["windows"]
    cmds:
      - "./build/tests/converter.exe"
  run-converter:
    desc: "run tests/converter.cpp"
    deps: ["build"]
    platforms: ["darwin", "linux"]
    cmds:
      - "./build/tests/converter"

  run-reader:
    desc: "run tests/reader.c"
    deps: ["build"]
    platforms: ["windows"]
    cmds:
      - "./build/tests/reader.exe"
  run-reader:
    desc: "run tests/reader.c"
    deps: ["build"]
    platforms: ["darwin", "linux"]
    cmds:
      - "./build/tests/reader"
